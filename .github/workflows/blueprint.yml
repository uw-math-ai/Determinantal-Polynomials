name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    # Not `ubuntu-latest`, which is moving to Ubuntu 26.04: docgen-action pins a `ruby/setup-ruby`
    # (v1.237.0) that has no Ruby builds for 26.04, so the Jekyll step would fail there.
    runs-on: ubuntu-24.04
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Replaces lean-action's cache, which is keyed by commit and so saves ~2 GB on every push.
      # This one only changes with the toolchain or the manifest. It is saved at the end of the job,
      # so it also holds the doc-gen4 executable built in the docs step. Every `docInfo` marker in
      # docgen-action's cache depends on the hash of that executable, and a recompiled doc-gen4 that
      # hashes differently makes Lake redo `docInfo` for all of Mathlib (~2 hours).
      - name: Cache Lake packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build and lint project
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          build: true
          # dont verify too deeply, just use ci to get a blueprint up
          lint: false
          mk_all-check: false
          use-github-cache: false

      - name: Compile blueprint and documentation
        # Needs a version that caches doc-gen4's `doc-data/` and `api-docs.db`. Older versions
        # cache only the HTML, so Lake re-analyzes all of Mathlib (~2 hours) on every run.
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05
        with:
          blueprint: true
          homepage: home_page
          # Ruby for the Jekyll home page (`home_page/Gemfile`). 3.4 is the newest Ruby that the
          # `ruby/setup-ruby` pinned by docgen-action can install.
          ruby-version: "3.4"
